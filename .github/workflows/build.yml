name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron:  '30 5 * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.prepare.outputs.build_matrix }}
      has_builds: ${{ steps.prepare.outputs.has_builds }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Python dependencies
      run: |
        python -m pip install click requests

    - name: Build matrix input
      id: prepare
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        include_json='[]'

        for release_line in ltr stable; do
          qgis_version_short=''
          qgis_version_patch=''
          qgis_version_tag=''

          while IFS='=' read -r key value; do
            case "$key" in
              QGIS_VERSION_SHORT) qgis_version_short="$value" ;;
              QGIS_VERSION_PATCH) qgis_version_patch="$value" ;;
              QGIS_VERSION_TAG) qgis_version_tag="$value" ;;
            esac
          done < <(python ./scripts/get_latest_qgis_versions.py --release="$release_line" --github_token="$GITHUB_TOKEN")

          qgis_major_version="${qgis_version_short%%.*}"
          if [ "$qgis_major_version" -ge 4 ]; then
            dockerfile_path='Dockerfile'
          else
            dockerfile_path='Dockerfile.qt5'
          fi

          token=$(curl -fsSL -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "https://ghcr.io/token?scope=repository:opengisch/qgis-slim:pull" | jq -r '.token')
          if curl -fsSI -H "Authorization: Bearer $token" -H "Accept: application/vnd.oci.image.index.v1+json" "https://ghcr.io/v2/opengisch/qgis-slim/manifests/$qgis_version_patch" > /dev/null; then
            echo "Skipping $release_line ($qgis_version_patch): image already exists"
            continue
          fi

          include_json=$(jq -c \
            --arg release_line "$release_line" \
            --arg qgis_version_short "$qgis_version_short" \
            --arg qgis_version_patch "$qgis_version_patch" \
            --arg qgis_version_tag "$qgis_version_tag" \
            --arg dockerfile_path "$dockerfile_path" \
            '. + [{
              release_line: $release_line,
              qgis_version_short: $qgis_version_short,
              qgis_version_patch: $qgis_version_patch,
              qgis_version_tag: $qgis_version_tag,
              dockerfile_path: $dockerfile_path
            }]' <<<"$include_json")
        done

        build_matrix=$(jq -cn -c --argjson include "$include_json" '{include: $include}')
        has_builds=$(jq -r 'if (.include | length) > 0 then "true" else "false" end' <<<"$build_matrix")

        echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"
        echo "has_builds=$has_builds" >> "$GITHUB_OUTPUT"

  build-docker-image:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: .
      file: ${{ matrix.dockerfile_path }}
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-26.04
        linux/arm64=ubuntu-26.04-arm
      cache: true
      build-args: |
        QGIS_VERSION=${{ matrix.qgis_version_tag }}
        QGIS_VERSION_SHORT=${{ matrix.qgis_version_short }}
      meta-images: |
        ghcr.io/opengisch/qgis-slim
      meta-tags: |
        type=raw,value=${{ matrix.release_line == 'ltr' && 'latest-ltr' || 'latest' }}
        type=raw,value=${{ matrix.release_line }}
        type=raw,value=${{ matrix.qgis_version_short }}
        type=raw,value=${{ matrix.qgis_version_patch }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
